name: Base de datos (migrar y verificar)

on:
  push:
    branches: [main]
    paths: ["app/**", "alembic/**", "alembic.ini", "requirements.txt", ".github/workflows/db.yml"]
  workflow_dispatch:

concurrency:
  group: db-main
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      # Secrets del repo (Settings > Secrets and variables > Actions)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}            # pooler en modo SESION (puerto 5432), IPv4
      SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
      SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
      ENV: prod
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Comprobar secrets
        run: |
          for v in DATABASE_URL SUPERADMIN_EMAIL SUPERADMIN_PASSWORD JWT_SECRET; do
            [ -n "${!v}" ] || { echo "::error::Falta el secret $v"; exit 1; }
          done
      - name: Aplicar migraciones
        run: alembic upgrade head
      - name: Sembrar planes, parámetros y super admin (idempotente)
        run: python -m app.seed
      - name: Verificar esquema
        run: python scripts/verificar_bd.py

  verificar-produccion:
    needs: migrar
    runs-on: ubuntu-latest
    steps:
      - name: Esperar y probar la API desplegada
        env:
          API_URL: ${{ secrets.API_URL }}   # p. ej. https://backendtoroin.vercel.app
        run: |
          [ -n "$API_URL" ] || { echo "Sin API_URL: se omite la prueba HTTP"; exit 0; }
          for i in $(seq 1 12); do
            r=$(curl -s -m 30 "$API_URL/health/db" || true); echo "intento $i: $r"
            echo "$r" | grep -q '"conexion":"ok"' && echo "$r" | grep -q '"tiene_empresas":true' && exit 0
            sleep 20
          done
          echo "::error::La API desplegada no confirma conexion y tablas"; exit 1
